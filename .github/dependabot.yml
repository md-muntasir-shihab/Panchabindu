version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Asia/Dhaka
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: 'chore(deps)'
    groups:
      # Framework runtime bumps arrive together so one CI run proves the whole stack.
      runtime:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
          - express
          - vite
          - '@vitejs/plugin-react'
      tooling:
        dependency-type: development
        update-types:
          - minor
          - patch
      security:
        applies-to: security-updates
        patterns:
          - '*'
    ignore:
      # Tailwind v4 and Radix majors need a design-system pass, not an automatic bump.
      - dependency-name: tailwindcss
        update-types: ['version-update:semver-major']
      - dependency-name: '@radix-ui/*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(ci)'
